{{define "content"}}
<div class="flex items-center justify-between mb-8">
  <div>
    <h1 class="page-title">Кошельки</h1>
    <p class="page-subtitle">Управление счетами</p>
  </div>
</div>

<div class="card bg-base-100 shadow-sm mb-4">
  <div class="card-body p-6">
    <div class="flex items-center justify-between mb-6">
      <h3 class="font-bold text-xl">Добавить кошелёк</h3>
      <button form="wallet-form" type="submit" class="btn btn-primary btn-sm font-semibold">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Добавить
      </button>
    </div>
    <form id="wallet-form"
          hx-post="/wallets"
          hx-target="#wallets-tbody"
          hx-swap="afterbegin"
          hx-on::after-request="this.reset()">
      <div class="flex flex-wrap gap-3 items-end mb-3">
        <div class="form-control flex-1 min-w-40">
          <label class="form-label">Название</label>
          <input type="text" name="name" placeholder="Наличные"
                 class="input input-bordered" required>
        </div>
        <div class="form-control">
          <label class="form-label">Валюта</label>
          <select name="currency" class="select select-bordered">
            <option value="RUB">RUB</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="CNY">CNY</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label text-xs">Описание (необязательно)</label>
        <textarea name="description" placeholder="Например: основной счёт, подушка безопасности, инвестиции..."
                  class="textarea textarea-bordered" rows="2"></textarea>
      </div>
    </form>
  </div>
</div>

<div class="card bg-base-100">
  <div class="overflow-x-auto">
    <table class="table table-sm">
      <thead>
        <tr>
          <th>Название</th>
          <th>Валюта</th>
          <th class="w-24"></th>
        </tr>
      </thead>
      <tbody id="wallets-tbody">
        {{range .Wallets}}
        {{template "wallet-row" .}}
        {{end}}
      </tbody>
    </table>
    {{if not .Wallets}}
    <div class="flex flex-col items-center justify-center py-16 text-base-content/20">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
      </svg>
      <p class="text-sm">Кошельки ещё не добавлены</p>
    </div>
    {{end}}
  </div>
</div>
{{end}}
