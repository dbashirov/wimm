{{define "wallet-edit-row"}}
<tr id="wallet-{{.ID}}" class="bg-base-200">
  <td colspan="3">
    <form class="flex flex-wrap gap-2 items-center py-2"
          hx-put="/wallets/{{.ID}}"
          hx-target="closest tr"
          hx-swap="outerHTML">
      <input type="text" name="name" value="{{.Name}}"
             class="input input-bordered input-sm flex-1 min-w-32" required>
      <select name="currency" class="select select-bordered select-sm">
        <option value="RUB" {{if eq .Currency "RUB"}}selected{{end}}>RUB</option>
        <option value="USD" {{if eq .Currency "USD"}}selected{{end}}>USD</option>
        <option value="EUR" {{if eq .Currency "EUR"}}selected{{end}}>EUR</option>
        <option value="GBP" {{if eq .Currency "GBP"}}selected{{end}}>GBP</option>
        <option value="CNY" {{if eq .Currency "CNY"}}selected{{end}}>CNY</option>
      </select>
      <button type="submit" class="btn btn-primary btn-sm font-semibold">Сохранить</button>
      <button type="button" class="btn btn-ghost btn-sm"
              hx-get="/wallets/{{.ID}}"
              hx-target="closest tr"
              hx-swap="outerHTML">Отмена</button>
    </form>
  </td>
</tr>
{{end}}
