{{define "operation-edit-row"}}
{{$op := .Op}}
{{$wallets := .Wallets}}
{{$cats := .Categories}}
<tr id="op-{{$op.ID}}" class="bg-base-200">
  <td colspan="7">
    <form hx-put="/operations/{{$op.ID}}"
          hx-target="closest tr"
          hx-swap="outerHTML">
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2 items-end py-2">
        <div class="form-control">
          <label class="form-label">Дата и время</label>
          <input type="text" name="operated_at" class="input input-bordered input-sm fp-datetime"
                 value="{{$op.OperatedAt.Format "2006-01-02T15:04"}}" required>
        </div>
        <div class="form-control">
          <label class="form-label">Тип</label>
          <select name="type" class="select select-bordered select-sm">
            <option value="expense" {{if eq $op.Type "expense"}}selected{{end}}>Расход</option>
            <option value="income"  {{if eq $op.Type "income"}}selected{{end}}>Доход</option>
          </select>
        </div>
        <div class="form-control">
          <label class="form-label">Сумма</label>
          <input type="number" name="amount" step="0.01" min="0.01"
                 class="input input-bordered input-sm"
                 value="{{money $op.Amount}}" required>
        </div>
        <div class="form-control">
          <label class="form-label">Кошелёк</label>
          <select name="wallet_id" class="select select-bordered select-sm" required>
            {{range $wallets}}
            <option value="{{.ID}}" {{if eq .ID $op.WalletID}}selected{{end}}>{{.Name}}</option>
            {{end}}
          </select>
        </div>
        <div class="form-control">
          <label class="form-label">Категория</label>
          <select name="category_id" class="select select-bordered select-sm" required>
            {{range $cats}}
            <option value="{{.ID}}" {{if eq .ID $op.CategoryID}}selected{{end}}>{{.Name}} ({{typeLabel .Type}})</option>
            {{end}}
          </select>
        </div>
        <div class="form-control col-span-2 lg:col-span-1">
          <label class="form-label">Описание</label>
          <input type="text" name="description" class="input input-bordered input-sm"
                 value="{{$op.Description}}">
        </div>
      </div>
      <div class="flex gap-2 pb-2">
        <button type="submit" class="btn btn-primary btn-sm font-semibold">Сохранить</button>
        <button type="button" class="btn btn-ghost btn-sm"
                hx-get="/operations/{{$op.ID}}"
                hx-target="closest tr"
                hx-swap="outerHTML">Отмена</button>
      </div>
    </form>
  </td>
</tr>
{{end}}
