{{define "wallet-row"}}
<tr id="wallet-{{.ID}}" class="hover">
  <td>
    <div>
      <div class="font-semibold flex items-center gap-2">
        {{.Name}}
        {{if .Hidden}}<span class="badge badge-sm badge-neutral">Скрыт</span>{{end}}
        {{if .IsDefault}}<span class="badge badge-sm badge-primary">По умолчанию</span>{{end}}
      </div>
      {{if .Description}}
      <div class="text-sm text-base-content/70 mt-1">{{.Description}}</div>
      {{end}}
    </div>
  </td>
  <td><span class="badge badge-ghost badge-sm">{{.Currency}}</span></td>
  <td>
    <div class="flex gap-1 justify-end">
      <a href="/wallets/{{.ID}}/stats" class="btn-action" title="Статистика">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
      </a>
      {{if not .IsDefault}}
      <button class="btn-action"
              title="Сделать основным"
              hx-post="/wallets/{{.ID}}/set-default"
              hx-target="#wallets-tbody"
              hx-swap="innerHTML">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
        </svg>
      </button>
      {{end}}
      <button class="btn-action"
              {{if .Hidden}}title="Показать"{{else}}title="Скрыть"{{end}}
              hx-post="/wallets/{{.ID}}/toggle-hidden"
              hx-target="closest tr"
              hx-swap="outerHTML">
        {{if .Hidden}}
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-4.803m5.596-3.856a3.375 3.375 0 11-4.753 4.753m4.874-1.6a2.36 2.36 0 00-3.365-3.365m2.12 2.12a2.36 2.36 0 01-3.366-3.366m7.218 7.218L21 21"/>
        </svg>
        {{else}}
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
        {{end}}
      </button>
      <button class="btn-action"
              hx-get="/wallets/{{.ID}}/edit"
              hx-target="closest tr"
              hx-swap="outerHTML"
              title="Редактировать">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
        </svg>
      </button>
      <button class="btn-action btn-action-danger"
              hx-delete="/wallets/{{.ID}}"
              hx-target="closest tr"
              hx-swap="outerHTML"
              hx-confirm="Удалить кошелёк «{{.Name}}»?"
              title="Удалить">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>
  </td>
</tr>
{{end}}
