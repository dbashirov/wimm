{{define "category-row"}}
<tr id="category-{{.ID}}" class="hover">
  <td class="font-medium">{{.Name}}</td>
  <td>
    {{if eq .Type "income"}}
    <span class="badge badge-success badge-sm gap-1">↑ Доход</span>
    {{else}}
    <span class="badge badge-error badge-sm gap-1">↓ Расход</span>
    {{end}}
  </td>
  <td>
    <div class="flex gap-1 justify-end">
      <button class="btn btn-ghost btn-xs"
              hx-get="/categories/{{.ID}}/edit"
              hx-target="closest tr"
              hx-swap="outerHTML"
              title="Редактировать">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
        </svg>
      </button>
      <button class="btn btn-ghost btn-xs text-error"
              hx-delete="/categories/{{.ID}}"
              hx-target="closest tr"
              hx-swap="outerHTML"
              hx-confirm="Удалить категорию «{{.Name}}»?"
              title="Удалить">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>
  </td>
</tr>
{{end}}
