{{define "content"}}
<div class="flex items-center justify-between mb-8">
  <div>
    <h1 class="page-title">Категории</h1>
    <p class="page-subtitle">Группировка операций</p>
  </div>
</div>

<div class="card bg-base-100 shadow-sm mb-4">
  <div class="card-body p-6">
    <div class="flex items-center justify-between mb-6">
      <h3 class="font-bold text-xl">Добавить категорию</h3>
      <button form="category-form" type="submit" class="btn btn-primary btn-form-submit font-semibold">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Добавить
      </button>
    </div>
    <form id="category-form"
          hx-post="/categories"
          hx-target="#categories-tbody"
          hx-swap="afterbegin"
          hx-on::after-request="this.reset()">
      <div class="flex flex-wrap gap-3 items-end">
        <div class="form-control flex-1 min-w-40">
          <label for="category-name" class="form-label">Название</label>
          <input type="text" id="category-name" name="name" placeholder="Продукты"
                 class="input input-bordered input-form" required>
        </div>
        <div class="form-control">
          <label for="category-type" class="form-label">Тип</label>
          <select id="category-type" name="type" class="select select-bordered input-form">
            <option value="expense">Расход</option>
            <option value="income">Доход</option>
          </select>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="card bg-base-100">
  <div class="overflow-x-auto">
    <table class="table table-sm">
      <thead>
        <tr>
          <th>Название</th>
          <th>Тип</th>
          <th class="w-24"></th>
        </tr>
      </thead>
      <tbody id="categories-tbody">
        {{range .Income}}{{template "category-row" .}}{{end}}
        {{range .Expense}}{{template "category-row" .}}{{end}}
      </tbody>
    </table>
    {{if and (not .Income) (not .Expense)}}
    <div class="flex flex-col items-center justify-center py-16 text-base-content/20">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z"/>
      </svg>
      <p class="text-sm">Категории ещё не добавлены</p>
    </div>
    {{end}}
  </div>
</div>
{{end}}
