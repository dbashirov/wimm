{{define "base"}}
<!DOCTYPE html>
<html lang="ru" data-theme="light" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wimm — личные финансы</title>
  <script>
    (function() {
      var t = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/ru.js"></script>
</head>
<body class="min-h-screen bg-base-200 font-sans">

{{if not .NoNav}}

          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
        </svg>
      </div>
      <ul tabindex="0" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-50 mt-3 w-52 p-2 shadow-lg border border-base-200">
        <li><a href="/dashboard">Дашборд</a></li>
        <li><a href="/wallets">Кошельки</a></li>
        <li><a href="/categories">Категории</a></li>
        <li><a href="/operations">Операции</a></li>
        <li>
          <form method="POST" action="/logout">
            <button type="submit" class="w-full text-left text-error">Выйти</button>
          </form>
        </li>
      </ul>
    </div>
    <a href="/dashboard" class="btn btn-ghost text-xl font-bold tracking-tight">wimm</a>
  </div>

  <div class="navbar-center hidden lg:flex">
    <ul class="menu menu-horizontal px-1 gap-1">
      <li><a href="/dashboard" class="rounded-lg font-medium">Дашборд</a></li>
      <li><a href="/wallets" class="rounded-lg font-medium">Кошельки</a></li>
      <li><a href="/categories" class="rounded-lg font-medium">Категории</a></li>

  <div class="navbar-end gap-2">
    <!-- Theme toggle -->
    <label class="swap swap-rotate btn btn-ghost btn-circle">

      <svg class="swap-on h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
      </svg>
      <svg class="swap-off h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/>
      </svg>
    </label>
    <!-- Logout (desktop only) -->
    <form method="POST" action="/logout" class="hidden lg:block">
      <button type="submit" class="btn btn-ghost btn-sm">Выйти</button>
    </form>
  </div>
</div>
<main class="container mx-auto px-4 py-6 max-w-6xl">
  {{template "content" .}}
</main>
{{else}}
{{template "content" .}}
{{end}}

<script>
  // Инициализация flatpickr для всех datetime-инпутов
  var fpConfig = {
    enableTime: true,
    dateFormat: 'Y-m-dTH:i',   // формат для отправки формы
    altInput: true,              // показывает человекочитаемый вид
    altFormat: 'd.m.Y H:i',     // отображение: 23.03.2026 14:30
    time_24hr: true,
    locale: 'ru',
    defaultDate: new Date(),     // текущие дата и время
    onReady: function(_, __, instance) {
      // копируем классы стилей с оригинального инпута на alt-инпут
      instance.altInput.className = instance.input.className.replace('fp-datetime', '').trim();
    },
  };
  function initFlatpickr() {
    document.querySelectorAll('.fp-datetime:not(.flatpickr-input)').forEach(function(el) {
      flatpickr(el, fpConfig);
    });
  }
  document.addEventListener('DOMContentLoaded', initFlatpickr);
  document.addEventListener('htmx:afterSettle', initFlatpickr);
</script>
<script>
  (function() {
    var toggle = document.getElementById('theme-toggle');
    if (!toggle) return;
    toggle.checked = document.documentElement.getAttribute('data-theme') === 'dark';
    toggle.addEventListener('change', function() {
      var theme = toggle.checked ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
    });
  })();
</script>
</body>
</html>
{{end}}
