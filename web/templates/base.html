{{define "base"}}
<!DOCTYPE html>
<html lang="ru" data-theme="dark" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wimm — личные финансы</title>
  <script>
    (function() {
      var t = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script>
    // CSRF: htmx автоматически отправляет токен из cookie csrf_token
    // в заголовке X-CSRF-Token на каждом мутирующем запросе.
    document.addEventListener('htmx:configRequest', function(evt) {
      var m = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/);
      if (m) evt.detail.headers['X-CSRF-Token'] = decodeURIComponent(m[1]);
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/ru.js"></script>
</head>
<body class="min-h-screen bg-base-200 font-sans">

</div>
<main class="container mx-auto px-4 py-10 max-w-6xl">

{{else}}
{{template "content" .}}
{{end}}

<script>
  // flatpickr init
  var fpConfig = {
    enableTime: true,
    dateFormat: 'Y-m-dTH:i',
    altInput: true,
    altFormat: 'd.m.Y H:i',
    time_24hr: true,
    locale: 'ru',
    defaultDate: new Date(),
    onReady: function(_, __, instance) {
      instance.altInput.className = instance.input.className.replace('fp-datetime', '').trim();
    },
  };
  var fpDateConfig = {
    enableTime: false,
    dateFormat: 'Y-m-d',
    altInput: true,
    altFormat: 'd.m.Y',
    locale: 'ru',
    onReady: function(_, __, instance) {
      instance.altInput.className = instance.input.className.replace('fp-date', '').trim();
    },
  };
  function initFlatpickr() {
    document.querySelectorAll('.fp-datetime:not(.flatpickr-input)').forEach(function(el) {
      flatpickr(el, fpConfig);
    });
    document.querySelectorAll('.fp-date:not(.flatpickr-input)').forEach(function(el) {
      flatpickr(el, fpDateConfig);
    });
  }
  document.addEventListener('DOMContentLoaded', initFlatpickr);
  document.addEventListener('htmx:afterSettle', initFlatpickr);
</script>
<script>
  (function() {
    // Theme toggle
    var toggle = document.getElementById('theme-toggle');
    if (toggle) {
      toggle.checked = document.documentElement.getAttribute('data-theme') === 'dark';
      toggle.addEventListener('change', function() {
        var theme = toggle.checked ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      });
    }

    // Active nav link highlight
    var path = window.location.pathname;
    document.querySelectorAll('.nav-link').forEach(function(a) {
      var href = a.getAttribute('href');
      var isActive = href === path ||
        (href !== '/dashboard' && path.startsWith(href));
      if (isActive) {
        a.classList.add('nav-link-active');
        a.classList.remove('text-base-content/70');
      }
    });
  })();
</script>

<!-- Toast-уведомления (ошибки htmx) -->
<div id="toast-container"
     class="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-2 pointer-events-none">
</div>
<script>
  var TOAST_DURATION = 5000;

  var ICON_ERROR = '<svg class="wimm-toast-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></svg>';
  var ICON_WARNING = '<svg class="wimm-toast-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 3h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>';

  function showToast(msg, type) {
    var container = document.getElementById('toast-container');
    var isError = type === 'error';
    var typeClass = isError ? 'wimm-toast-error' : 'wimm-toast-warning';
    var icon = isError ? ICON_ERROR : ICON_WARNING;

    var toast = document.createElement('div');
    toast.className = 'wimm-toast ' + typeClass + ' pointer-events-auto';
    toast.innerHTML =
      icon +
      '<div class="wimm-toast-body">' + msg + '</div>' +
      '<button class="wimm-toast-close" aria-label="Закрыть">' +
        '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>' +
      '</button>' +
      '<div class="wimm-toast-progress" style="animation-duration:' + TOAST_DURATION + 'ms"></div>';

    container.appendChild(toast);

    function dismiss() {
      toast.classList.add('hiding');
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 280);
    }

    toast.querySelector('.wimm-toast-close').addEventListener('click', dismiss);
    setTimeout(dismiss, TOAST_DURATION);
  }

  document.addEventListener('htmx:responseError', function(evt) {
    var xhr = evt.detail.xhr;
    var msg = xhr.responseText
      ? xhr.responseText.trim()
      : 'Ошибка сервера (' + xhr.status + ')';
    showToast(msg, xhr.status === 409 ? 'warning' : 'error');
  });
</script>
</body>
</html>
