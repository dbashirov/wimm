services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgres://wimm:wimm@postgres:5432/wimm?sslmode=disable
      SERVER_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wimm
      POSTGRES_PASSWORD: wimm
      POSTGRES_DB: wimm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wimm -d wimm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
